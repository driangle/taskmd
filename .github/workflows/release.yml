name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # ── Validation jobs (mirror `make check`) ──────────────────────────

  lint-cli:
    name: Lint CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: golangci/golangci-lint-action@v4
        with:
          version: v1.64.8
          install-mode: goinstall
          working-directory: apps/cli
          args: --timeout=5m

  test-cli:
    name: Test CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build CLI
        working-directory: apps/cli
        run: go build ./...
      - name: Run tests
        working-directory: apps/cli
        run: go test -race ./...

  test-sdk:
    name: Test SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build SDK
        working-directory: sdk/go
        run: go build ./...
      - name: Run tests
        working-directory: sdk/go
        run: go test -race ./...

  check-web:
    name: Check Web Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            apps/web/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Type check
        working-directory: apps/web
        run: pnpm run typeCheck
      - name: Lint
        working-directory: apps/web
        run: pnpm run lint
      - name: Test
        working-directory: apps/web
        run: pnpm test

  check-vscode:
    name: Check VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: apps/vscode
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: apps/vscode
        run: pnpm run lint
      - name: Test
        working-directory: apps/vscode
        run: pnpm test

  build-docs:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: apps/docs
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: apps/docs
        run: pnpm build

  docker-check:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: taskmd:ci-check

  # ── Release job (gates on all checks) ──────────────────────────────

  release:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: [lint-cli, test-cli, test-sdk, check-web, check-vscode, build-docs, docker-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            apps/web/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build web frontend
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Copy web assets to CLI
        run: |
          mkdir -p apps/cli/internal/web/static
          cp -r apps/web/dist apps/cli/internal/web/static/dist

      - name: Build binaries
        working-directory: apps/cli
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GIT_COMMIT: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.repository.updated_at }}
        run: |
          # Create output directory
          mkdir -p ../../dist

          # Build flags with version info
          LDFLAGS="-s -w \
            -X 'github.com/driangle/taskmd/apps/cli/internal/cli.Version=${VERSION}' \
            -X 'github.com/driangle/taskmd/apps/cli/internal/cli.GitCommit=${GIT_COMMIT}' \
            -X 'github.com/driangle/taskmd/apps/cli/internal/cli.BuildDate=${BUILD_DATE}'"

          # Build for Linux AMD64
          echo "Building for linux/amd64..."
          GOOS=linux GOARCH=amd64 go build -tags embed_web -ldflags="$LDFLAGS" -o ../../dist/taskmd-linux-amd64 ./cmd/taskmd

          # Build for Linux ARM64
          echo "Building for linux/arm64..."
          GOOS=linux GOARCH=arm64 go build -tags embed_web -ldflags="$LDFLAGS" -o ../../dist/taskmd-linux-arm64 ./cmd/taskmd

          # Build for macOS AMD64
          echo "Building for darwin/amd64..."
          GOOS=darwin GOARCH=amd64 go build -tags embed_web -ldflags="$LDFLAGS" -o ../../dist/taskmd-darwin-amd64 ./cmd/taskmd

          # Build for macOS ARM64
          echo "Building for darwin/arm64..."
          GOOS=darwin GOARCH=arm64 go build -tags embed_web -ldflags="$LDFLAGS" -o ../../dist/taskmd-darwin-arm64 ./cmd/taskmd

          # Build for Windows AMD64
          echo "Building for windows/amd64..."
          GOOS=windows GOARCH=amd64 go build -tags embed_web -ldflags="$LDFLAGS" -o ../../dist/taskmd-windows-amd64.exe ./cmd/taskmd

          # Build for Windows ARM64
          echo "Building for windows/arm64..."
          GOOS=windows GOARCH=arm64 go build -tags embed_web -ldflags="$LDFLAGS" -o ../../dist/taskmd-windows-arm64.exe ./cmd/taskmd

      - name: Compress binaries
        working-directory: dist
        run: |
          # Compress Linux AMD64
          tar -czf taskmd-${{ steps.version.outputs.tag }}-linux-amd64.tar.gz taskmd-linux-amd64

          # Compress Linux ARM64
          tar -czf taskmd-${{ steps.version.outputs.tag }}-linux-arm64.tar.gz taskmd-linux-arm64

          # Compress macOS AMD64
          tar -czf taskmd-${{ steps.version.outputs.tag }}-darwin-amd64.tar.gz taskmd-darwin-amd64

          # Compress macOS ARM64
          tar -czf taskmd-${{ steps.version.outputs.tag }}-darwin-arm64.tar.gz taskmd-darwin-arm64

          # Compress Windows AMD64
          zip taskmd-${{ steps.version.outputs.tag }}-windows-amd64.zip taskmd-windows-amd64.exe

          # Compress Windows ARM64
          zip taskmd-${{ steps.version.outputs.tag }}-windows-arm64.zip taskmd-windows-arm64.exe

      - name: Create MCPB bundles
        run: |
          # macOS ARM64
          ./scripts/build-mcpb.sh dist/taskmd-darwin-arm64 ${{ steps.version.outputs.version }} darwin arm64 dist

          # macOS AMD64
          ./scripts/build-mcpb.sh dist/taskmd-darwin-amd64 ${{ steps.version.outputs.version }} darwin amd64 dist

          # Linux AMD64
          ./scripts/build-mcpb.sh dist/taskmd-linux-amd64 ${{ steps.version.outputs.version }} linux amd64 dist

          # Linux ARM64
          ./scripts/build-mcpb.sh dist/taskmd-linux-arm64 ${{ steps.version.outputs.version }} linux arm64 dist

          # Windows AMD64
          ./scripts/build-mcpb.sh dist/taskmd-windows-amd64.exe ${{ steps.version.outputs.version }} windows amd64 dist

          # Windows ARM64
          ./scripts/build-mcpb.sh dist/taskmd-windows-arm64.exe ${{ steps.version.outputs.version }} windows arm64 dist

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum taskmd-${{ steps.version.outputs.tag }}-*.tar.gz taskmd-${{ steps.version.outputs.tag }}-*.zip *.mcpb > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/taskmd-${{ steps.version.outputs.tag }}-linux-amd64.tar.gz
            dist/taskmd-${{ steps.version.outputs.tag }}-linux-arm64.tar.gz
            dist/taskmd-${{ steps.version.outputs.tag }}-darwin-amd64.tar.gz
            dist/taskmd-${{ steps.version.outputs.tag }}-darwin-arm64.tar.gz
            dist/taskmd-${{ steps.version.outputs.tag }}-windows-amd64.zip
            dist/taskmd-${{ steps.version.outputs.tag }}-windows-arm64.zip
            dist/taskmd-v${{ steps.version.outputs.version }}-darwin-arm64.mcpb
            dist/taskmd-v${{ steps.version.outputs.version }}-darwin-amd64.mcpb
            dist/taskmd-v${{ steps.version.outputs.version }}-linux-amd64.mcpb
            dist/taskmd-v${{ steps.version.outputs.version }}-linux-arm64.mcpb
            dist/taskmd-v${{ steps.version.outputs.version }}-windows-amd64.mcpb
            dist/taskmd-v${{ steps.version.outputs.version }}-windows-arm64.mcpb
            dist/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Extract SHA256 checksums from checksums.txt
          cd dist
          SHA256_DARWIN_ARM64=$(grep "darwin-arm64.tar.gz" checksums.txt | awk '{print $1}')
          SHA256_DARWIN_AMD64=$(grep "darwin-amd64.tar.gz" checksums.txt | awk '{print $1}')
          SHA256_LINUX_ARM64=$(grep "linux-arm64.tar.gz" checksums.txt | awk '{print $1}')
          SHA256_LINUX_AMD64=$(grep "linux-amd64.tar.gz" checksums.txt | awk '{print $1}')
          cd ..

          # Clone the homebrew-tap repository
          git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/driangle/homebrew-tap.git tap-repo
          cd tap-repo

          # Generate the formula file
          cat > Formula/taskmd.rb << 'EOF'
          class Taskmd < Formula
            desc "Markdown-based task management CLI and web dashboard"
            homepage "https://github.com/driangle/taskmd"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/driangle/taskmd/releases/download/TAG_PLACEHOLDER/taskmd-TAG_PLACEHOLDER-darwin-arm64.tar.gz"
                sha256 "SHA256_DARWIN_ARM64_PLACEHOLDER"
              end
              on_intel do
                url "https://github.com/driangle/taskmd/releases/download/TAG_PLACEHOLDER/taskmd-TAG_PLACEHOLDER-darwin-amd64.tar.gz"
                sha256 "SHA256_DARWIN_AMD64_PLACEHOLDER"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/driangle/taskmd/releases/download/TAG_PLACEHOLDER/taskmd-TAG_PLACEHOLDER-linux-arm64.tar.gz"
                sha256 "SHA256_LINUX_ARM64_PLACEHOLDER"
              end
              on_intel do
                url "https://github.com/driangle/taskmd/releases/download/TAG_PLACEHOLDER/taskmd-TAG_PLACEHOLDER-linux-amd64.tar.gz"
                sha256 "SHA256_LINUX_AMD64_PLACEHOLDER"
              end
            end

            def install
              bin.install "taskmd-darwin-arm64" => "taskmd" if OS.mac? && Hardware::CPU.arm?
              bin.install "taskmd-darwin-amd64" => "taskmd" if OS.mac? && Hardware::CPU.intel?
              bin.install "taskmd-linux-arm64" => "taskmd" if OS.linux? && Hardware::CPU.arm?
              bin.install "taskmd-linux-amd64" => "taskmd" if OS.linux? && Hardware::CPU.intel?
            end

            test do
              system bin/"taskmd", "--version"
              assert_match version.to_s, shell_output("#{bin}/taskmd --version")
            end
          end
          EOF

          # Replace placeholders with actual values
          sed -i "s/TAG_PLACEHOLDER/${TAG}/g" Formula/taskmd.rb
          sed -i "s/SHA256_DARWIN_ARM64_PLACEHOLDER/${SHA256_DARWIN_ARM64}/g" Formula/taskmd.rb
          sed -i "s/SHA256_DARWIN_AMD64_PLACEHOLDER/${SHA256_DARWIN_AMD64}/g" Formula/taskmd.rb
          sed -i "s/SHA256_LINUX_ARM64_PLACEHOLDER/${SHA256_LINUX_ARM64}/g" Formula/taskmd.rb
          sed -i "s/SHA256_LINUX_AMD64_PLACEHOLDER/${SHA256_LINUX_AMD64}/g" Formula/taskmd.rb

          # Install Homebrew on Linux for formula auditing
          if ! command -v brew &> /dev/null; then
            NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi

          # Link the cloned repo as a Homebrew tap so audit can find it by name
          BREW_TAP_DIR="$(brew --repository)/Library/Taps/driangle/homebrew-tap"
          mkdir -p "$(dirname "$BREW_TAP_DIR")"
          ln -sfn "$(pwd)" "$BREW_TAP_DIR"

          # Audit formula before pushing
          brew audit --strict --formula driangle/tap/taskmd

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Commit and push
          git add Formula/taskmd.rb
          git commit -m "Update taskmd formula to ${VERSION}

          Auto-generated by release workflow
          Release: https://github.com/driangle/taskmd/releases/tag/${TAG}"
          git push origin main

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Download pre-built release binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p docker-context
          cd docker-context
          gh release download ${{ steps.version.outputs.tag }} \
            --pattern "taskmd-${{ steps.version.outputs.tag }}-linux-amd64.tar.gz" \
            --pattern "taskmd-${{ steps.version.outputs.tag }}-linux-arm64.tar.gz"
          tar xzf taskmd-${{ steps.version.outputs.tag }}-linux-amd64.tar.gz
          tar xzf taskmd-${{ steps.version.outputs.tag }}-linux-arm64.tar.gz
          ls -la

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/driangle/taskmd
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./docker-context
          file: ./Dockerfile.release
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      - name: Set package to public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github.v3+json" \
            /user/packages/container/taskmd \
            -f visibility=public || echo "Note: Could not set visibility. Set it manually in GitHub package settings."
        continue-on-error: true
